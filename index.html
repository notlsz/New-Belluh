    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              belluh: {
                25: 'var(--color-belluh-25, #FFFCFD)',
                50: 'var(--color-belluh-50, #FFF5F7)',
                100: 'var(--color-belluh-100, #FFE4E9)',
                200: 'var(--color-belluh-200, #FFD0DB)',
                300: 'var(--color-belluh-300, #FFC5D3)',
                400: 'var(--color-belluh-400, #FFB0C0)',
                500: 'var(--color-belluh-500, #FF90A5)',
                600: 'var(--color-belluh-600, #E11D48)',
                900: 'var(--color-belluh-900, #881337)',
              },
              paper: 'var(--color-belluh-25, #FFFCFD)',
              slate: {
                850: '#1e293b',
                900: '#0f172a',
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              serif: ['Merriweather', 'Georgia', 'Cambria', 'Times New Roman', 'serif'],
            },
            boxShadow: {
              'apple': '0 8px 30px rgba(0,0,0,0.04)',
              'float': '0 20px 40px -10px rgba(0,0,0,0.1)',
              'glow': '0 0 20px rgba(240, 173, 221, 0.5)',
              'soft': '0 4px 20px -2px rgba(0,0,0,0.05)',
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'float': 'float 6s ease-in-out infinite',
              'breathing': 'breathing 8s ease-in-out infinite',
              'marquee': 'marquee 40s linear infinite',
              'marquee-reverse': 'marqueeReverse 40s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pop: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              breathing: {
                 '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                 '50%': { transform: 'scale(1.1)', opacity: '0.5' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              marqueeReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' },

    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Ensure inputs don't have default ugly outlines */
      input:focus, textarea:focus {
        outline: none;
        box-shadow: none;
      }
      /* Belluh's presence: a small pond of light-blue water (drawn live by BelluhOrb), with a soft glow and a glassy surface */
      .belluh-orb { position: relative; display: inline-block; flex-shrink: 0; }
      .belluh-orb-glow { position: absolute; inset: -40%; border-radius: 50%; background: radial-gradient(circle, rgba(155,190,203,0.55) 0%, rgba(205,233,242,0.3) 42%, rgba(255,255,255,0) 70%); filter: blur(3px); animation: belluh-orb-breathe 4.5s ease-in-out infinite; }
      .belluh-orb-water { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 2px 8px rgba(63,116,134,0.2); }
      .belluh-orb-shine { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse 34% 22% at 33% 22%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5); }
      .belluh-orb.is-thinking .belluh-orb-glow { animation-duration: 1.2s; }
      .belluh-orb.is-3d .belluh-orb-water { inset: -20%; width: 140%; height: 140%; border-radius: 0; box-shadow: none; filter: drop-shadow(0 2px 3px rgba(63,116,134,0.16)); }
      .belluh-orb.is-3d .belluh-orb-glow { inset: -30%; opacity: 0.85; }
      /* The dragonfly mark: a water ripple spreading out when it appears or is tapped, and the mark bobbing with it */
      @keyframes belluh-ripple { 0% { transform: scale(0.55); opacity: 0.55; box-shadow: 0 0 0 1.5px rgba(155,190,203,0.9), inset 0 0 6px rgba(155,190,203,0.5); } 100% { transform: scale(2.6); opacity: 0; box-shadow: 0 0 0 1px rgba(155,190,203,0.15), inset 0 0 2px rgba(155,190,203,0); } }
      .belluh-ripple { animation: belluh-ripple 1.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
      .belluh-ripple + .belluh-ripple { animation-delay: 0.12s; }
      @keyframes belluh-bob { 0% { transform: scale(1); } 30% { transform: scale(0.9) translateY(1px); } 65% { transform: scale(1.05); } 100% { transform: scale(1); } }
      .belluh-ripple ~ .belluh-mark { animation: belluh-bob 0.7s ease-out; }
      @media (prefers-reduced-motion: reduce) { .belluh-ripple { animation-duration: 0.01s; } .belluh-ripple ~ .belluh-mark { animation: none; } }
      @keyframes belluh-orb-breathe { 0%, 100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1.06); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .belluh-orb-glow { animation: none !important; } }
    </style>
