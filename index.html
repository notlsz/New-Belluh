    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              belluh: {
                25: 'var(--color-belluh-25, #FFFCFD)',
                50: 'var(--color-belluh-50, #FFF5F7)',
                100: 'var(--color-belluh-100, #FFE4E9)',
                200: 'var(--color-belluh-200, #FFD0DB)',
                300: 'var(--color-belluh-300, #FFC5D3)',
                400: 'var(--color-belluh-400, #FFB0C0)',
                500: 'var(--color-belluh-500, #FF90A5)',
                600: 'var(--color-belluh-600, #E11D48)',
                900: 'var(--color-belluh-900, #881337)',
              },
              paper: 'var(--color-belluh-25, #FFFCFD)',
              slate: {
                850: '#1e293b',
                900: '#0f172a',
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              serif: ['Merriweather', 'Georgia', 'Cambria', 'Times New Roman', 'serif'],
            },
            boxShadow: {
              'apple': '0 8px 30px rgba(0,0,0,0.04)',
              'float': '0 20px 40px -10px rgba(0,0,0,0.1)',
              'glow': '0 0 20px rgba(240, 173, 221, 0.5)',
              'soft': '0 4px 20px -2px rgba(0,0,0,0.05)',
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'float': 'float 6s ease-in-out infinite',
              'breathing': 'breathing 8s ease-in-out infinite',
              'marquee': 'marquee 40s linear infinite',
              'marquee-reverse': 'marqueeReverse 40s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pop: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              breathing: {
                 '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                 '50%': { transform: 'scale(1.1)', opacity: '0.5' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              marqueeReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Ensure inputs don't have default ugly outlines */
      input:focus, textarea:focus {
        outline: none;
        box-shadow: none;
      }
      /* Belluh's presence: a softly glowing, slowly turning sphere in the brand blue and pink */
      .belluh-orb { position: relative; display: inline-block; flex-shrink: 0; border-radius: 9999px; }
      .belluh-orb > span { position: absolute; border-radius: 9999px; }
      .belluh-orb-glow { inset: -40%; background: radial-gradient(circle, rgba(155,190,203,0.55) 0%, rgba(240,173,221,0.28) 42%, rgba(255,255,255,0) 70%); filter: blur(3px); animation: belluh-orb-breathe 4.5s ease-in-out infinite; }
      .belluh-orb-core { inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 60%, #b7d6e2, #9bbecb); box-shadow: inset 0 -3px 8px rgba(63,116,134,0.35), inset 0 2px 6px rgba(255,255,255,0.6); }
      .belluh-orb-core::before, .belluh-orb-core::after { content: ''; position: absolute; border-radius: 9999px; filter: blur(2px); }
      .belluh-orb-core::before { inset: -30%; background: radial-gradient(circle at 30% 30%, rgba(240,173,221,0.95) 0, rgba(240,173,221,0) 38%), radial-gradient(circle at 72% 42%, rgba(205,233,242,0.95) 0, rgba(205,233,242,0) 40%), radial-gradient(circle at 45% 78%, rgba(155,190,203,0.9) 0, rgba(155,190,203,0) 42%); animation: belluh-orb-spin 9s linear infinite; }
      .belluh-orb-core::after { inset: -20%; background: radial-gradient(circle at 62% 24%, rgba(255,255,255,0.7) 0, rgba(255,255,255,0) 30%), radial-gradient(circle at 24% 70%, rgba(240,173,221,0.6) 0, rgba(240,173,221,0) 35%); animation: belluh-orb-spin 13s linear infinite reverse; }
      .belluh-orb-shine { inset: 0; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.35) 18%, rgba(255,255,255,0) 45%); }
      .belluh-orb.is-thinking .belluh-orb-core::before { animation-duration: 1.6s; }
      .belluh-orb.is-thinking .belluh-orb-core::after { animation-duration: 2.2s; }
      .belluh-orb.is-thinking .belluh-orb-glow { animation-duration: 1.1s; }
      @keyframes belluh-orb-spin { to { transform: rotate(360deg); } }
      @keyframes belluh-orb-breathe { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .belluh-orb > span, .belluh-orb-core::before, .belluh-orb-core::after { animation: none !important; } }
    </style>
