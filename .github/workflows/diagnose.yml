# Read-only check of why old journals don't load. Prints counts only: no entry text, names or emails.
name: Diagnose journals
on:
  push:
    branches: [diagnose-journals]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ctbsycrlakdanfzbaqmz' }}
    steps:
      - name: Counts
        run: |
          q() {
            echo "== $1"
            jq -n --arg q "$2" '{query: $q}' | curl -sS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -c '.'
          }
          ME="d95a25a6-e873-41d1-80ef-26258d3ff3b7"
          logs() {
            echo "== logs: $1"
            curl -sS -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs.all" \
              --data-urlencode "sql=$2" --data-urlencode "iso_timestamp_start=$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)" --data-urlencode "iso_timestamp_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | jq -c '.result // .error // .' | head -c 4000; echo
          }
          logs "REST requests by path and status (12h)" "select regexp_extract(r.path, '^/rest/v1/[a-z_]+') p, resp.status_code s, count(*) n from edge_logs cross join unnest(metadata) m cross join unnest(m.request) r cross join unnest(m.response) resp where r.path like '/rest/v1/%' group by p, s order by n desc limit 40"
          logs "auth events (12h)" "select regexp_extract(event_message, '\"(action|msg)\":\"[^\"]+\"') a, count(*) n from auth_logs group by a order by n desc limit 20"
          logs "auth: who signed in (12h, owner or not)" "select timestamp, regexp_contains(event_message, 'd95a25a6-e873-41d1-80ef-26258d3ff3b7') is_owner, regexp_extract(event_message, '\"action\":\"[^\"]+\"') action, regexp_extract(event_message, '\"provider\":\"[^\"]+\"') provider from auth_logs where regexp_contains(event_message, 'login|token_refreshed|user_signedup|user_recovery') order by timestamp desc limit 15"
          logs "postgres errors (12h)" "select timestamp, regexp_extract(event_message, '^.{0,160}') m from postgres_logs where parsed.error_severity in ('ERROR','FATAL') order by timestamp desc limit 15"
          A="begin read only; set local role authenticated; select set_config('request.jwt.claims', json_build_object('sub','$ME','role','authenticated')::text, true);"
          q "as me: grants" "select has_table_privilege('authenticated','public.journal_entries','select') je, has_table_privilege('authenticated','public.profiles','select') pr, has_table_privilege('authenticated','public.partner_connections','select') pc, has_function_privilege('authenticated','public.are_partners(uuid,uuid)','execute') ap, has_function_privilege('authenticated','public.can_see_profile(uuid)','execute') csp"
          q "as me: my profile visible" "$A select count(*) from public.profiles where id='$ME'; "
          q "as me: connections visible" "$A select count(*) from public.partner_connections where status='connected' and ('$ME' in (user_id, partner_id));"
          q "as me: partner profiles visible" "$A select count(*) from public.profiles p where p.id in (select case when c.user_id='$ME' then c.partner_id else c.user_id end from public.partner_connections c where c.status='connected' and '$ME' in (c.user_id,c.partner_id));"
          q "as me: entries visible (mine, partners)" "$A select count(*) filter (where user_id='$ME') mine, count(*) filter (where user_id<>'$ME') partners from public.journal_entries where user_id in (select '$ME'::uuid union select case when c.user_id='$ME' then c.partner_id else c.user_id end from public.partner_connections c where c.status='connected' and '$ME' in (c.user_id,c.partner_id));"
          q "profiles policies" "select policyname, cmd, qual from pg_policies where schemaname='public' and tablename='profiles'"
          q "storage objects in buckets" "select bucket_id, count(*) from storage.objects group by 1"
          q "media refs in entries" "select count(*) filter (where photo_url like 'sb://%' or audio_url like 'sb://%') private_refs, count(*) filter (where photo_url like 'http%' or audio_url like 'http%') http_refs from public.journal_entries"
          q "mine: each partner in the order the app gets them (no ids)" "with c as (select row_number() over () pos, c.*, case when c.user_id='$ME' then c.partner_id else c.user_id end p from public.partner_connections c where c.status='connected' and '$ME' in (c.user_id, c.partner_id)) select pos, c.created_at::date connected_on, (select count(*) from public.profiles pr where pr.id=c.p) has_profile, (select count(*) from public.journal_entries je where je.user_id=c.p) their_entries, (select count(*) from public.journal_entries je where je.user_id=c.p and je.is_shared) their_shared, (select count(*) from public.journal_entries je where je.user_id=c.p and je.is_shared and 'circle:c1'=any(je.tags)) their_shared_c1, (select count(*) from public.journal_entries je where je.user_id=c.p and je.is_shared and ('circle:partner_'||'$ME')=any(je.tags)) their_shared_tagged_me, (select count(*) from public.journal_entries je where je.user_id='$ME' and ('circle:partner_'||c.p::text)=any(je.tags)) mine_tagged_them, (select count(*) from public.partner_connections c2 where c2.status='connected' and c.p in (c2.user_id,c2.partner_id)) their_partner_count from c order by pos"
          q "mine: my entries by circle tag and month" "select to_char(created_at,'YYYY-MM') m, coalesce((select left(t,16) from unnest(tags) t where t like 'circle:%' limit 1),'none') circle, count(*) from public.journal_entries where user_id='$ME' and not exists (select 1 from unnest(tags) t where t like 'system_%') group by 1,2 order by 1"
          q "mine: system entries (kind, circle tag shape, status)" "select (select string_agg(t, ',') from unnest(tags) t where t like 'system_%' or t like 'status:%') kinds, coalesce((select case when t='circle:c1' then 'c1' when t like 'circle:partner_%' then 'partner_x' else 'uuid' end from unnest(tags) t where t like 'circle:%' limit 1),'none') circle from public.journal_entries where user_id='$ME' and exists (select 1 from unnest(tags) t where t like 'system_%')"
          q "mine: my entry types and moods" "select type, mood, count(*) from public.journal_entries where user_id='$ME' group by 1,2"
          q "all entry types" "select type, count(*) from public.journal_entries group by 1"
          q "public tables and row counts" "select relname as table, n_live_tup as rows from pg_stat_user_tables where schemaname='public' order by n_live_tup desc"
          q "entries total, with no circle tag, own-user missing from auth" "select count(*) total, count(*) filter (where not exists (select 1 from unnest(tags) t where t like 'circle:%')) no_circle, count(*) filter (where user_id is null) null_user, count(*) filter (where user_id is not null and not exists (select 1 from auth.users u where u.id = journal_entries.user_id)) orphan_user from public.journal_entries"
          q "entries by circle tag kind" "select case when t = 'circle:c1' then 'c1' when t like 'circle:partner_%' then 'partner_x' when t ~ '^circle:[0-9a-f-]{36}$' then 'circle_def_uuid' else 'other:'||left(t,20) end kind, count(*) from public.journal_entries, unnest(tags) t where t like 'circle:%' group by 1 order by 2 desc"
          q "system entries" "select t, count(*) from public.journal_entries, unnest(tags) t where t like 'system_%' or t like 'status:%' group by 1"
          q "entries per user (top 10, counts only)" "select count(*) n, count(*) filter (where is_shared) shared from public.journal_entries group by user_id order by 1 desc limit 10"
          q "partner_connections by status" "select status, count(*) from public.partner_connections group by 1"
          q "users with more than one connected partner" "select count(*) from (select u, count(*) from (select user_id u from public.partner_connections where status='connected' union all select partner_id from public.partner_connections where status='connected') x group by u having count(*) > 1) y"
          q "auth users, and emails used by more than one account" "select (select count(*) from auth.users) users, (select count(*) from (select lower(email) from auth.users where email is not null group by 1 having count(*) > 1) d) dup_emails"
          q "entries whose author has a connected partner vs not" "select count(*) filter (where exists (select 1 from public.partner_connections c where c.status='connected' and journal_entries.user_id in (c.user_id, c.partner_id))) with_partner, count(*) filter (where not exists (select 1 from public.partner_connections c where c.status='connected' and journal_entries.user_id in (c.user_id, c.partner_id))) without_partner from public.journal_entries"
          q "journal_entries columns" "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='journal_entries' order by ordinal_position"
          q "policies on journal_entries" "select policyname, cmd from pg_policies where schemaname='public' and tablename='journal_entries'"
          q "PostgREST max rows setting (db-max-rows)" "select current_setting('pgrst.db_max_rows', true) as max_rows"
