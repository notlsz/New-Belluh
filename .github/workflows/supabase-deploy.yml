# Deploys Belluh's Supabase backend (database migrations, edge functions, secrets, weekly schedule).
# Runs on GitHub's servers with Belluh's own Supabase token, so it never touches any other Supabase account.
#
# One-time setup (GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  Belluh's Supabase account → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   Belluh's project → Project Settings → Database (reset it there if unknown)
#   GEMINI_API_KEY         Google AI Studio key
# Optional backup AI, used only when Gemini can't answer (any or all; each is skipped without a key):
#   GROQ_API_KEY           console.groq.com/keys
#   CEREBRAS_API_KEY       cloud.cerebras.ai
#   OPENROUTER_API_KEY     openrouter.ai/keys
# Optional, for WhatsApp dates and reminders (see docs/whatsapp-occasions.md):
#   WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN
# Optional, for the same by plain SMS (Twilio):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM (a Twilio number or a Messaging Service SID, MG...)
# Optional, for texting Belluh on Telegram (the fastest: no business number or carrier registration):
#   TELEGRAM_BOT_TOKEN     from @BotFather in Telegram (/newbot); the webhook is registered below
# Optional, for iMessage (Linq: a real iPhone number, blue bubbles, SMS fallback for Android):
#   LINQ_API_KEY           Linq dashboard → API keys
#   LINQ_WEBHOOK_SECRET    the signing secret Linq shows when you add the webhook (whsec_...)
#   LINQ_FROM              optional: which of your Linq numbers sends, when you have more than one
#   Also set VITE_BELLUH_IMESSAGE_NUMBER in Vercel so Settings shows "Connect iMessage".
# Optional, for Belluh calling a restaurant to book a table (Vapi voice agent + Google Places for the number):
#   VAPI_API_KEY           dashboard.vapi.ai → API Keys (private key)
#   VAPI_PHONE_NUMBER_ID   dashboard.vapi.ai → Phone Numbers (an imported Twilio/Telnyx number; free Vapi numbers can't call out)
#   GOOGLE_PLACES_API_KEY  console.cloud.google.com → Places API (New) key
# Optional, groceries as one Instacart cart instead of an item-by-item list:
#   INSTACART_API_KEY      instacart.com/company/business/developers (Developer Platform, production key)
# Optional repository variable SUPABASE_PROJECT_REF (defaults to the project the app points at).

name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LINQ_API_KEY: ${{ secrets.LINQ_API_KEY }}
      LINQ_WEBHOOK_SECRET: ${{ secrets.LINQ_WEBHOOK_SECRET }}
      LINQ_FROM: ${{ secrets.LINQ_FROM }}
      VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
      VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      INSTACART_API_KEY: ${{ secrets.INSTACART_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ctbsycrlakdanfzbaqmz' }}
    steps:
      - name: Check setup
        id: setup
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GEMINI_API_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping the backend deploy. Add these repository secrets first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.setup.outputs.ready == 'true'

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: steps.setup.outputs.ready == 'true'
        with:
          version: 2.120.0

      - name: Check the project is reachable
        if: steps.setup.outputs.ready == 'true'
        run: |
          status=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r .status || true)
          echo "Project $PROJECT_REF status: ${status:-not found with this token}"
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Belluh's Supabase project isn't active (status: ${status:-not found}). Restore it in the Supabase dashboard, then re-run this workflow."
            exit 1
          fi

      - name: Link project
        if: steps.setup.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: steps.setup.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Move old photos and voice notes to private storage
        if: steps.setup.outputs.ready == 'true'
        run: |
          SERVICE_KEY=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret")][0].api_key // empty')
          if [ -z "$SERVICE_KEY" ]; then
            echo "::warning::Couldn't read the service key; old media was not moved. Re-run this workflow to retry."
            exit 0
          fi
          echo "::add-mask::$SERVICE_KEY"
          SUPABASE_URL="https://${PROJECT_REF}.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" node scripts/migrate-legacy-media.mjs

      - name: Set function secrets
        if: steps.setup.outputs.ready == 'true'
        run: |
          # A fresh cron secret each deploy; the schedule below is updated to match in the same run
          CRON_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          supabase secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY" CRON_SECRET="$CRON_SECRET"
          # Backup AI providers, each only if its key exists
          backup=""
          for k in GROQ_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY INSTACART_API_KEY; do
            if [ -n "${!k}" ]; then backup="$backup $k=${!k}"; fi
          done
          if [ -n "$backup" ]; then
            # shellcheck disable=SC2086
            supabase secrets set --project-ref "$PROJECT_REF" $backup
            echo "Backup AI on:$(for k in GROQ_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY; do [ -n "${!k}" ] && printf ' %s' "${k%%_API_KEY}"; done)"
          else
            echo "::notice::No backup AI keys; if Gemini is out of quota, Belluh says it's having trouble. Add GROQ_API_KEY to turn on a free backup."
          fi

      - name: Deploy edge functions
        if: steps.setup.outputs.ready == 'true'
        run: |
          supabase functions deploy gemini-proxy --project-ref "$PROJECT_REF"
          supabase functions deploy belluh-agent --project-ref "$PROJECT_REF"
          supabase functions deploy belluh-weekly --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy belluh-calendar --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy belluh-push --project-ref "$PROJECT_REF"
          supabase functions deploy belluh-nudges --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Belluh calls restaurants (Vapi)
        if: steps.setup.outputs.ready == 'true'
        run: |
          if [ -n "$VAPI_API_KEY" ] && [ -n "$VAPI_PHONE_NUMBER_ID" ] && [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" VAPI_API_KEY="$VAPI_API_KEY" VAPI_PHONE_NUMBER_ID="$VAPI_PHONE_NUMBER_ID" GOOGLE_PLACES_API_KEY="$GOOGLE_PLACES_API_KEY"
            # The call webhook's secret is derived from the key inside the functions (vapi.ts), so there's nothing else to store
            supabase functions deploy vapi-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "Calls are on. Belluh can phone restaurants once someone taps Call for me."
          else
            echo "::notice::Calls are off: add VAPI_API_KEY, VAPI_PHONE_NUMBER_ID and GOOGLE_PLACES_API_KEY to let Belluh phone restaurants."
          fi

      - name: Texting Belluh (WhatsApp, SMS, Telegram, iMessage) and reminders
        if: steps.setup.outputs.ready == 'true'
        run: |
          on=""
          if [ -n "$WHATSAPP_ACCESS_TOKEN" ] && [ -n "$WHATSAPP_PHONE_NUMBER_ID" ] && [ -n "$WHATSAPP_APP_SECRET" ] && [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" WHATSAPP_ACCESS_TOKEN="$WHATSAPP_ACCESS_TOKEN" WHATSAPP_PHONE_NUMBER_ID="$WHATSAPP_PHONE_NUMBER_ID" \
              WHATSAPP_APP_SECRET="$WHATSAPP_APP_SECRET" WHATSAPP_VERIFY_TOKEN="$WHATSAPP_VERIFY_TOKEN"
            supabase functions deploy whatsapp-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "WhatsApp is on. Webhook URL for Meta: https://${PROJECT_REF}.supabase.co/functions/v1/whatsapp-webhook"
            on="yes"
          else
            echo "::notice::WhatsApp is off: add the four WHATSAPP_* secrets to turn it on (docs/whatsapp-occasions.md)."
          fi
          if [ -n "$TWILIO_ACCOUNT_SID" ] && [ -n "$TWILIO_AUTH_TOKEN" ] && [ -n "$TWILIO_FROM" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" TWILIO_FROM="$TWILIO_FROM"
            supabase functions deploy sms-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "SMS is on. Twilio 'A message comes in' webhook (HTTP POST): https://${PROJECT_REF}.supabase.co/functions/v1/sms-webhook"
            on="yes"
          else
            echo "::notice::SMS is off: add TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and TWILIO_FROM to turn it on (docs/whatsapp-occasions.md)."
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::add-mask::$TELEGRAM_BOT_TOKEN"
            supabase secrets set --project-ref "$PROJECT_REF" TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            supabase functions deploy telegram-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
            # The webhook secret is derived from the token (same as telegram.ts webhookSecret), so there's nothing else to store
            TG_SECRET=$(printf 'belluh-telegram:%s' "$TELEGRAM_BOT_TOKEN" | openssl dgst -sha256 -hex | awk '{print $NF}' | cut -c1-48)
            echo "::add-mask::$TG_SECRET"
            curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/telegram-webhook" \
              --data-urlencode "secret_token=${TG_SECRET}" \
              --data-urlencode 'allowed_updates=["message"]' > /dev/null && echo "Telegram is on."
            curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands" -H 'Content-Type: application/json' \
              -d '{"commands":[{"command":"help","description":"What I can do"},{"command":"list","description":"Your saved dates"},{"command":"stop","description":"Pause my messages"}]}' > /dev/null || true
            on="yes"
          else
            echo "::notice::Telegram is off: add TELEGRAM_BOT_TOKEN (from @BotFather) to turn it on."
          fi
          if [ -n "$LINQ_API_KEY" ] && [ -n "$LINQ_WEBHOOK_SECRET" ]; then
            echo "::add-mask::$LINQ_API_KEY"
            supabase secrets set --project-ref "$PROJECT_REF" LINQ_API_KEY="$LINQ_API_KEY" LINQ_WEBHOOK_SECRET="$LINQ_WEBHOOK_SECRET"
            if [ -n "$LINQ_FROM" ]; then supabase secrets set --project-ref "$PROJECT_REF" LINQ_FROM="$LINQ_FROM"; fi
            supabase functions deploy linq-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "iMessage is on. Linq webhook (message.received): https://${PROJECT_REF}.supabase.co/functions/v1/linq-webhook?version=2026-02-03"
            on="yes"
          else
            echo "::notice::iMessage is off: add LINQ_API_KEY and LINQ_WEBHOOK_SECRET to turn it on."
          fi
          [ -z "$on" ] && exit 0
          supabase functions deploy occasion-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
          sql=$(cat <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          select cron.schedule('occasion-reminders', '5 * * * *', \$cron\$
            select net.http_post(
              url := 'https://${PROJECT_REF}.supabase.co/functions/v1/occasion-reminders',
              headers := jsonb_build_object('x-cron-secret', '${CRON_SECRET}')
            );
          \$cron\$);
          SQL
          )
          jq -n --arg q "$sql" '{query: $q}' | curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" > /dev/null

      - name: Schedule the weekly loop (hourly) and nudges (every 5 minutes)
        if: steps.setup.outputs.ready == 'true'
        run: |
          sql=$(cat <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          select cron.schedule('belluh-weekly', '10 * * * *', \$cron\$
            select net.http_post(
              url := 'https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly',
              headers := jsonb_build_object('x-cron-secret', '${CRON_SECRET}')
            );
          \$cron\$);
          select cron.schedule('belluh-nudges', '*/5 * * * *', \$cron\$
            select net.http_post(
              url := 'https://${PROJECT_REF}.supabase.co/functions/v1/belluh-nudges',
              headers := jsonb_build_object('x-cron-secret', '${CRON_SECRET}')
            );
          \$cron\$);
          SQL
          )
          jq -n --arg q "$sql" '{query: $q}' | curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" > /dev/null
          echo "Weekly loop and nudges scheduled."

      - name: Check storage rules
        if: steps.setup.outputs.ready == 'true'
        run: |
          sql="select coalesce(string_agg(policyname, ', '), '') as p from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname not in ('jp_owner_insert', 'jp_owner_or_partner_read', 'jp_owner_delete', 'jm_avatar_insert', 'jm_avatar_delete')"
          extra=$(jq -n --arg q "$sql" '{query: $q}' | curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -r '.[0].p // ""')
          if [ -n "$extra" ]; then
            echo "::error::Old storage rules are still active: $extra. Delete them in Supabase → Storage → Policies."
            exit 1
          fi
          echo "Storage rules are the expected set."

      - name: Smoke test
        if: steps.setup.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly")
          echo "belluh-weekly without the secret returned $code (expect 403)"
          [ "$code" = "403" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "x-cron-secret: $CRON_SECRET" "https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly")
          echo "belluh-weekly with the secret returned $code (expect 200)"
          [ "$code" = "200" ]
