# Deploys Belluh's Supabase backend (database migrations, edge functions, secrets, weekly schedule).
# Runs on GitHub's servers with Belluh's own Supabase token, so it never touches any other Supabase account.
#
# One-time setup (GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  Belluh's Supabase account → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   Belluh's project → Project Settings → Database (reset it there if unknown)
#   GEMINI_API_KEY         Google AI Studio key
# Optional repository variable SUPABASE_PROJECT_REF (defaults to the project the app points at).

name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ctbsycrlakdanfzbaqmz' }}
    steps:
      - name: Check setup
        id: setup
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GEMINI_API_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping the backend deploy. Add these repository secrets first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.setup.outputs.ready == 'true'

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: steps.setup.outputs.ready == 'true'
        with:
          version: 2.120.0

      - name: Check the project is reachable
        if: steps.setup.outputs.ready == 'true'
        run: |
          status=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r .status || true)
          echo "Project $PROJECT_REF status: ${status:-not found with this token}"
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Belluh's Supabase project isn't active (status: ${status:-not found}). Restore it in the Supabase dashboard, then re-run this workflow."
            exit 1
          fi

      - name: Link project
        if: steps.setup.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: steps.setup.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Set function secrets
        if: steps.setup.outputs.ready == 'true'
        run: |
          # A fresh cron secret each deploy; the schedule below is updated to match in the same run
          CRON_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          supabase secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY" CRON_SECRET="$CRON_SECRET"

      - name: Deploy edge functions
        if: steps.setup.outputs.ready == 'true'
        run: |
          supabase functions deploy gemini-proxy --project-ref "$PROJECT_REF"
          supabase functions deploy belluh-agent --project-ref "$PROJECT_REF"
          supabase functions deploy belluh-weekly --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Schedule the weekly loop (hourly)
        if: steps.setup.outputs.ready == 'true'
        run: |
          sql=$(cat <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          select cron.schedule('belluh-weekly', '10 * * * *', \$cron\$
            select net.http_post(
              url := 'https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly',
              headers := jsonb_build_object('x-cron-secret', '${CRON_SECRET}')
            );
          \$cron\$);
          SQL
          )
          jq -n --arg q "$sql" '{query: $q}' | curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" > /dev/null
          echo "Weekly loop scheduled."

      - name: Check storage rules
        if: steps.setup.outputs.ready == 'true'
        run: |
          sql="select coalesce(string_agg(policyname, ', '), '') as p from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname not in ('jp_owner_insert', 'jp_owner_or_partner_read', 'jp_owner_delete', 'jm_avatar_insert', 'jm_avatar_delete')"
          extra=$(jq -n --arg q "$sql" '{query: $q}' | curl -sf -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -r '.[0].p // ""')
          if [ -n "$extra" ]; then
            echo "::error::Old storage rules are still active: $extra. Delete them in Supabase → Storage → Policies."
            exit 1
          fi
          echo "Storage rules are the expected set."

      - name: Smoke test
        if: steps.setup.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly")
          echo "belluh-weekly without the secret returned $code (expect 403)"
          [ "$code" = "403" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "x-cron-secret: $CRON_SECRET" "https://${PROJECT_REF}.supabase.co/functions/v1/belluh-weekly")
          echo "belluh-weekly with the secret returned $code (expect 200)"
          [ "$code" = "200" ]
